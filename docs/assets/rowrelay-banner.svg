<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">RowRelay</title>
  <desc id="desc">PostgreSQL changes. Kafka events. One relay. A diagram connects committed database rows through RowRelay to event streams.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101E2B"/>
      <stop offset="1" stop-color="#08131E"/>
    </linearGradient>
    <linearGradient id="flow" x1="700" y1="0" x2="1090" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#347C91"/>
      <stop offset="1" stop-color="#64E4CB"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#B5D5E7" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#background)"/>
  <rect width="1200" height="400" rx="20" fill="url(#grid)"/>
  <path d="M64 74H94M64 85H86M64 96H94" stroke="#64E4CB" stroke-width="4" stroke-linecap="round"/>
  <path d="m95 80 7 5-7 5" stroke="#64E4CB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="118" y="92" fill="#A9BDCA" font-size="14" font-weight="600" letter-spacing="3">COMMITTED CHANGES. RELIABLY DELIVERED.</text>
    <text x="60" y="199" fill="#F0F6FA" font-size="80" font-weight="700" letter-spacing="-4">Row<tspan fill="#64E4CB">Relay</tspan></text>
    <text x="64" y="247" fill="#BACBD6" font-size="23">PostgreSQL changes. Kafka events.</text>
    <text x="64" y="280" fill="#BACBD6" font-size="23">One relay.</text>
    <text x="64" y="347" fill="#7C96A8" font-size="13" font-weight="600" letter-spacing="2">TRIGGER-BASED CDC</text>
    <circle cx="253" cy="342" r="2" fill="#64E4CB"/>
    <text x="269" y="347" fill="#7C96A8" font-size="13" font-weight="600" letter-spacing="2">TRANSACTIONAL OUTBOX</text>
    <text x="672" y="94" fill="#7C96A8" font-size="11" font-weight="600" letter-spacing="2">POSTGRESQL</text>
    <text x="1024" y="94" fill="#7C96A8" font-size="11" font-weight="600" letter-spacing="2">KAFKA</text>
  </g>
  <g stroke="url(#flow)" stroke-width="2">
