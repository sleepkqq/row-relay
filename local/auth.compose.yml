# Real TLS/SCRAM acceptance uses Kafka JVM: Native 4.3.0 fails SASL's
# Subject#doAs/callAs reflection path. This is separate from resource benchmarks.
services:
  kafka:
    image: apache/kafka:4.3.0@sha256:0be4c9eb3565733612d2836d65636fd611a219ebcf5b4162e5ac259ea0ecb907
    ports:
      - 127.0.0.1:29095:9095
    volumes:
      - ./secrets/broker.pem:/etc/kafka/secrets/broker.pem:ro
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094,AUTH://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:29092,INTERNAL://kafka:9094,AUTH://127.0.0.1:29095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,AUTH:SASL_SSL
      KAFKA_LISTENER_NAME_AUTH_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_LISTENER_NAME_AUTH_SCRAM___SHA___512_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
      KAFKA_LISTENER_NAME_AUTH_SSL_KEYSTORE_TYPE: PEM
      KAFKA_LISTENER_NAME_AUTH_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/broker.pem
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      # Loopback-only plaintext is the fixture administration path.
      KAFKA_SUPER_USERS: User:ANONYMOUS
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'
